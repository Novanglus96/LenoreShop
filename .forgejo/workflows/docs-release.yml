name: Deploy MkDocs (Release)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy docs for (e.g. v1.8.1)"
        required: true
jobs:
  docs:
    uses: lenore/lenore-ci/.forgejo/workflows/docs.yml@v1
    with:
      mode: release
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      dry_run: false
    secrets: inherit
